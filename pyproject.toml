[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yadc"
version = "0.8.1"
description = "Yet Another Dataset Captioner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests==2.32.5",
    "httpx>=0.27",
    "pillow==11.3.0",
    "pydantic==2.11.7",
    "jinja2>=3.1.6",
    "platformdirs>=4.4.0",
    "keyring>=25.6.0",
    "keyring-pass>=0.9.3",
    "click>=8.3.0",
    "typing-extensions>=4.15.0",
    "quart>=0.20.0",
    "uvicorn[standard]>=0.30.0",
    "injector>=0.22.0",
    "watchdog>=4.0",
    "tomlkit>=0.15.0",
    "cryptography>=46.0.1",
    "stream-zip>=0.0.84",
]

[project.optional-dependencies]
test = [
    "keyrings-alt>=5.0.2",
    "mock>=5.2.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-integration>=0.2.3",
    "pytest-timeout>=2.4.0",
    "requests-mock>=1.12.1",
]
dev = [
    "basedpyright>=1.29.1",
]

[project.scripts]
yadc = "yadc.cli:cli"

[tool.setuptools.package-data]
"yadc.api" = ["banner.txt"]
"yadc.api.migrations" = ["*.sql"]
"yadc.templates.jinja" = ["*"]
"yadc.webui" = ["build/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["node_modules/**/*"]
"yadc.webui" = ["node_modules/**/*", "src/**/*", "static/**/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["yadc*"]

[tool.ruff]
target-version = "py313"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.basedpyright]
exclude = ["tests", ".venv", "**/node_modules", "yadc/webui"]
reportAny = "none"
reportExplicitAny = "none"
reportUnusedCallResult = "none"
reportPrivateUsage = "none"
reportUnsafeMultipleInheritance = "none"
reportImplicitStringConcatenation = "none"
reportMissingSuperCall = "none"
reportMissingTypeArgument = "none"
reportUnknownVariableType = "none"

[tool.pytest.ini_options]
timeout = 5
addopts = "-m 'not integration_test'"
markers = [
    "integration_test: marks tests as integration tests (slow, disabled by default)",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
