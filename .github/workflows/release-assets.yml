name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-version:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - id: extract
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            # workflow_dispatch — read version from pyproject.toml
            TAG="$(grep '^version' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)".*/\1/')"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building for version $VERSION (from $TAG)"

  build-package:
    name: Build sdist + wheel
    needs: extract-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Build SvelteKit frontend
        shell: bash
        run: |
          pushd yadc/webui
          npm ci
          npm run build
          popd

      - name: Update version files from tag
        shell: bash
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          echo "Setting version to $VERSION (from tag)"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/__version__ = \"[^\"]+\"/__version__ = \"$VERSION\"/" yadc/__init__.py
          echo "--- pyproject.toml ---"
          grep '^version' pyproject.toml | head -1
          echo "--- yadc/__init__.py ---"
          grep '__version__' yadc/__init__.py
          uv lock

      - name: Build sdist and wheel
        run: |
          uv build
          ls -lh dist/

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # ``github.ref`` for a ``release: published`` run is the
          # default branch, not the tag — the action's auto-detect
          # then complains "GitHub Releases requires a tag". Pass the
          # tag explicitly from the release event.
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/yadc-${{ needs.extract-version.outputs.version }}-py3-none-any.whl
            dist/yadc-${{ needs.extract-version.outputs.version }}.tar.gz
          fail_on_unmatched_files: true

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yadc-python-${{ needs.extract-version.outputs.version }}-ubuntu-latest
          path: |
            dist/yadc-${{ needs.extract-version.outputs.version }}-py3-none-any.whl
            dist/yadc-${{ needs.extract-version.outputs.version }}.tar.gz
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    needs: extract-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-cpu
            variant: cpu
            extra: ''
            spec: build_exe.spec
            exe_suffix: ''
          - os: windows-latest
            label: windows-cpu
            variant: cpu
            extra: ''
            spec: build_exe.spec
            exe_suffix: '.exe'
          - os: windows-latest
            label: windows-gpu
            variant: gpu
            extra: '--extra gpu'
            spec: build_exe_gpu.spec
            exe_suffix: '.exe'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Update version files from tag
        shell: bash
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          echo "Setting version to $VERSION (from tag)"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/__version__ = \"[^\"]+\"/__version__ = \"$VERSION\"/" yadc/__init__.py
          echo "--- pyproject.toml ---"
          grep '^version' pyproject.toml | head -1
          echo "--- yadc/__init__.py ---"
          grep '__version__' yadc/__init__.py
          uv lock

      - name: Build SvelteKit frontend
        shell: bash
        run: |
          pushd yadc/webui
          npm ci
          npm run build
          popd

      - name: Install yadc with [packaging${{ matrix.extra }}]
        shell: bash
        run: |
          uv sync --extra packaging ${{ matrix.extra }}

      - name: Run PyInstaller
        shell: bash
        run: |
          # PyInstaller refuses ``--name`` when a spec file is supplied
          # (the spec's ``EXE(..., name=...)`` is authoritative). Edit
          # the spec in place so the output binary carries the
          # versioned name. The pattern ``name='yadc-webui-{variant}'``
          # is the same on both ``build_exe.spec`` and
          # ``build_exe_gpu.spec`` (the GPU spec is identical except
          # for the literal ``cpu`` → ``gpu``).
          sed -i -E "s/name='yadc-webui-(cpu|gpu)'/name='yadc-webui-\1-${{ needs.extract-version.outputs.version }}'/" scripts/${{ matrix.spec }}
          echo "--- updated spec name ---"
          grep -E "^\s*name=" scripts/${{ matrix.spec }}
          uv run pyinstaller scripts/${{ matrix.spec }} \
            --distpath build/dist \
            --workpath build/work-${{ matrix.variant }} \
            --clean

      - name: Show output
        shell: bash
        run: ls -lh build/dist/

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # See the build-package step for why we pass ``tag_name``
          # explicitly instead of relying on auto-detect.
          tag_name: ${{ github.event.release.tag_name }}
          files: build/dist/yadc-webui-${{ matrix.variant }}-${{ needs.extract-version.outputs.version }}${{ matrix.exe_suffix }}
          fail_on_unmatched_files: true

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yadc-webui-${{ matrix.variant }}-${{ needs.extract-version.outputs.version }}-${{ matrix.os }}
          path: build/dist/yadc-webui-${{ matrix.variant }}-${{ needs.extract-version.outputs.version }}${{ matrix.exe_suffix }}
          if-no-files-found: error
